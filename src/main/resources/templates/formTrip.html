<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Trip</title>
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${trip.id == null} ? 'Nuevo Trip' : 'Editar Trip'"></h4>
        </div>
        <div class="card-body">
            <form th:action="@{/trips/save}" th:object="${trip}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre del Trip</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <!-- ✅ FIX: usamos categoriaId en lugar del objeto completo -->
                        <select class="form-select" name="categoriaId">
                            <option value="">Selecciona una categoría</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.id}"
                                    th:text="${cat.nombre}"
                                    th:selected="${trip.categoria != null and trip.categoria.id == cat.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción corta</label>
                    <input type="text" class="form-control" th:field="*{descripcion}">
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" th:field="*{fecha}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Costo ($)</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{costo}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" th:field="*{estatus}">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">URL de la Imagen</label>
                    <input type="text" class="form-control" th:field="*{imagen}" placeholder="/images/nombre-imagen.jpg">
                </div>

                <div class="mb-3">
                    <label class="form-label">Detalles completos</label>
                    <textarea class="form-control" th:field="*{detalles}" rows="6"></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a th:href="@{/listado}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-success btn-lg">Guardar Trip</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
