<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>TripApp | Los mejores Trips en El Salvador</title>

    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
    <link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
            <a class="navbar-brand" th:href="@{/}">TripApp</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarsExampleDefault">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu 1</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Menu 2</a></li>
                </ul>
                <a class="btn btn-outline-light mx-2" href="#">Ingresar</a>
                <a class="btn btn-outline-light" href="#">Registrarse</a>
            </div>
        </nav>
    </header>

    <main role="main">
        <div class="jumbotron">
            <div class="container">
                <h1 class="display-3">Encuentra los mejores Trips en El Salvador.</h1>
                <p>Puedes buscar por descripción y categoría.</p>
            </div>
        </div>

        <div class="container">
            <h2 class="text-center mb-4">DESTACADOS</h2>

            <div class="row">
                <div th:each="trip : ${trips}" class="col-md-4 mb-4">
                    <div class="card h-100 shadow">
                        <img th:src="@{${trip.imagen}}" class="card-img-top" alt="${trip.nombre}" style="height: 220px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${trip.nombre}"></h5>
                            <p class="card-text" th:text="${trip.descripcion.length() > 110 ? trip.descripcion.substring(0,110) + '...' : trip.descripcion}"></p>
                        </div>
                        <div class="card-footer">
                            <a th:href="@{/trips/view/{id}(id=${trip.id})}" class="btn btn-primary">Ver detalles &raquo;</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 TripApp | Demo Clase 2 - Programación 3 | Creado por David Escobar (EZ100221)</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
</body>
</html>
